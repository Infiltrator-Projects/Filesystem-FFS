name: Independent FFS shared-object qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ffs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Enforce FFS-only source and shared-object ownership
        run: python3 tests/ownership_boundary_test.py
      - name: Build FFS.so V1/V2 and run original independent DOS1/3/5 core/media tests
        run: make test

      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build/cmake-unified
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -f "$stage/System/Filesystems/FFS.so"
          test -f "$stage/System/Resources/Documentation/Filesystem-FFS.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-FFS.pdf")" = '%PDF-'
