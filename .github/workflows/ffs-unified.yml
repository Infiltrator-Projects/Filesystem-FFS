name: Strict FFS Common V2 source and carrier qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ffs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assert this repository owns only FFS.so
        run: python3 tests/ownership_boundary_test.py
      - name: Verify preinstalled build prerequisites
        run: cmake --version && cc --version && test -f /usr/include/openssl/sha.h
      - name: Verify native FFS reader and Common V2 regression suite
        run: make test
      - name: Build only Common V2 FFS.so with verified embedded firmware ELF
        run: |
          cmake -S . -B build-unified -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-unified --target ffs-unified --parallel 2
          nm -D --defined-only build-unified/FFS.so | grep -F 'infiltrator_filesystem_api_v2'
          sh tests/check_production_v2.sh build-unified/FFS.so
          # All CTest executables must exist; only building the two historical
          # targets would falsely fail the new actual-source native regressions.
          cmake --build build-unified --parallel 2
          ctest --test-dir build-unified --output-on-failure
