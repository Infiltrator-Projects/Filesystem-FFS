# SPDX-License-Identifier: GPL-3.0-or-later
# Direct Common V2 firmware profile and real FFS media qualification.
# BOOT, an ESP and NVRAM are never accessed or modified.
name: Qualify FFS freestanding Common V2 reader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ffs-uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate filesystem reader and embedded ELF from native source
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/firmware-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/firmware-ci --parallel 2
          ctest --test-dir build/firmware-ci --output-on-failure
          stage="$RUNNER_TEMP/stage"
          DESTDIR="$stage" cmake --install build/firmware-ci
          module="$stage/System/Filesystems/FFS.so"
          cmp "$module" build/firmware-ci/FFS.so
          bash tests/check-freestanding-v2.sh "$module"
          objcopy --dump-section ".infiltrator_boot=$RUNNER_TEMP/firmware.so" "$module" "$RUNNER_TEMP/carrier.so"
          cmp "$RUNNER_TEMP/firmware.so" build/firmware-ci/firmware/FFS.so
      - name: Read actual disposable FFS DOS1 files via packaged Common V2
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/ffs-media"
          mkdir -p "$build"
          cc -std=c11 -O2 -Wall -Wextra -Werror \
             tests/ffs_boot_fixture.c native/filesystems/ffs/core/ffs_primitives.c \
             -o "$build/create"
          cc -std=c11 -O2 -Wall -Wextra -Werror \
             -Ibuild/firmware-ci/_deps/infiltratr_common-src/include \
             tests/ffs_boot_v2_test.c -ldl -o "$build/verify"
          dd if=/dev/urandom of="$build/kernel.bin" bs=1M count=2 status=none
          dd if=/dev/urandom of="$build/initramfs" bs=256K count=1 status=none
          "$build/create" "$build/media.img" "$build/kernel.bin" "$build/initramfs"
          (cd "$build" && sha256sum media.img > original.sha256)
          cp "$build/media.img" "$build/corrupt.img"
          # Damage the root block checksum byte on the separate copy.
          checksum_byte=$((2048 * 32768 + 20))
          original_byte=$(od -An -tu1 -N1 -j "$checksum_byte" "$build/corrupt.img")
          printf '%b' "\\$(printf '%03o' "$((original_byte ^ 1))")" |
            dd of="$build/corrupt.img" bs=1 seek="$checksum_byte" conv=notrunc status=none
          "$build/verify" "$RUNNER_TEMP/stage/System/Filesystems/FFS.so" \
             "$build/media.img" "$build/kernel.bin" "$build/initramfs" \
             "$build/corrupt.img"
          (cd "$build" && sha256sum -c original.sha256)
